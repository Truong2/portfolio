name: Visual Evidence

on:
  push:
    branches:
      - feature/focus-reading-mode
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start app
        run: |
          npm run start -- -p 3000 > /tmp/portfolio-next.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/portfolio-next.log
          exit 1

      - name: Install Chromium
        run: npx --yes playwright@1.55.0 install --with-deps chromium

      - name: Capture cover
        run: npx --yes playwright@1.55.0 screenshot --viewport-size="1586,992" --wait-for-timeout=4500 http://127.0.0.1:3000/ evidence-cover.png

      - name: Capture experience
        run: npx --yes playwright@1.55.0 screenshot --viewport-size="1586,992" --wait-for-timeout=4500 "http://127.0.0.1:3000/?view=experience" evidence-experience.png

      - name: Capture focus reading
        run: npx --yes playwright@1.55.0 screenshot --viewport-size="1586,992" --wait-for-timeout=4500 "http://127.0.0.1:3000/?view=profile&focus=1" evidence-reading-focus.png

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: visual-evidence
          path: |
            evidence-cover.png
            evidence-experience.png
            evidence-reading-focus.png
          if-no-files-found: error
          retention-days: 7
